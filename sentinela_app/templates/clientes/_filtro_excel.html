{# Filtro multi no cabeçalho (estilo Excel). form_id liga os checkboxes ao form da busca. #}
<div class="relative inline-flex items-center gap-1" data-filtro-excel>
  <span>{{ rotulo }}</span>
  <button type="button" onclick="alternarFiltroExcel(this)" class="inline-flex h-5 min-w-[1.25rem] items-center justify-center rounded border {% if selecionados %}border-pink-500 bg-pink-600 text-white{% else %}border-pink-200 bg-white text-pink-800{% endif %} px-1 text-[10px] font-extrabold shadow-sm hover:bg-pink-100" title="Filtrar {{ rotulo }} (várias opções)">
    {% if selecionados %}{{ selecionados|length }}{% else %}▾{% endif %}
  </button>
  <div class="painel-filtro-excel absolute left-0 top-full z-50 mt-1 hidden w-64 rounded-xl border border-stone-200 bg-white p-2 text-left font-normal normal-case tracking-normal text-stone-800 shadow-xl">
    <p class="mb-1 px-1 text-[10px] font-semibold uppercase tracking-wide text-stone-400">Marque uma ou mais · Aplicar</p>
    <div class="mb-2 max-h-52 space-y-0.5 overflow-auto">
      {% for valor, texto in opcoes %}
      <label class="flex cursor-pointer items-start gap-2 rounded-lg px-2 py-1.5 text-xs text-stone-800 hover:bg-pink-50">
        <input type="checkbox" name="{{ nome }}" value="{{ valor }}" form="{{ form_id|default:'form-filtros-clientes' }}" class="mt-0.5" {% if valor in selecionados %}checked{% endif %}>
        <span>{{ texto }}</span>
      </label>
      {% empty %}
      <p class="px-2 py-1 text-xs text-stone-400">Sem opções</p>
      {% endfor %}
    </div>
    <div class="flex items-center gap-1 border-t border-stone-100 pt-2">
      <button type="submit" form="{{ form_id|default:'form-filtros-clientes' }}" class="flex-1 rounded-lg bg-pink-600 px-2 py-1.5 text-xs font-bold text-white">Aplicar</button>
      <button type="button" onclick="limparGrupoFiltroExcel(this)" class="rounded-lg border border-stone-200 px-2 py-1.5 text-xs font-semibold text-stone-600">Limpar</button>
    </div>
  </div>
</div>
