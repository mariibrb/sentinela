databases:
  - name: sentinela-db
    plan: free
    databaseName: sentinela
    user: sentinela

services:
  - type: web
    name: sentinela
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd sentinela_app && python manage.py collectstatic --noinput
    startCommand: cd sentinela_app && python manage.py migrate --noinput && python manage.py preparar_ambiente && gunicorn sentinela.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: sentinela-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: desenvolvedora
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: SENTINELA_COLABORADOR_USER
        value: mariana.barbosa
      - key: SENTINELA_COLABORADOR_PASSWORD
        sync: false
